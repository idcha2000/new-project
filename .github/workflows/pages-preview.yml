name: Build and deploy Developer Studio to GitHub Pages

on:
  push:
    branches:
      - feature/initial-dashboard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-feature-initial-dashboard
  cancel-in-progress: true

jobs:
  build:
    name: Lint and static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Export static Next.js site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Verify exported homepage
        run: |
          test -s out/index.html
          test -d out/_next
          touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Publish branch preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
